[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nicheradar"
version = "0.1.0"
description = "Metadata-only YouTube Shorts niche intelligence engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "SQLAlchemy==2.0.52",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]